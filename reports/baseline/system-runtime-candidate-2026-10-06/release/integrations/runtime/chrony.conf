# Candidate only. Install under /etc/chrony/marketdata.conf after a separately approved cutover.
# No automatic clock step, RTC write, local reference, or hidden config includes.
pool ntp.ubuntu.com iburst maxsources 4 minpoll 6 maxpoll 8
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
maxupdateskew 100.0
leapsectz right/UTC
port 0
bindcmdaddress 127.0.0.1
cmdport 323

