# Candidate only. Install under /etc/chrony/marketdata.conf after a separately approved cutover.
# RTC UTC confirmation is required by the chrony unit's ExecStartPre.
# Steady daemon has no automatic step; the separate boot coordinator owns it.
server 162.159.200.1 iburst minpoll 6 maxpoll 8
server 133.243.238.163 iburst minpoll 6 maxpoll 8
server 194.58.200.20 iburst minpoll 6 maxpoll 8
server 192.53.103.108 iburst minpoll 6 maxpoll 8
rtcsync
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
maxupdateskew 100.0
leapsectz right/UTC
leapsecmode slew
port 0
bindcmdaddress 127.0.0.1
cmdport 323
